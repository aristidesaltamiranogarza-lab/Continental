<style>
/* ---------- Vista 3D a pantalla completa, estilo juegos de Windows 7 (Aero) ---------- */
html.c3on,html.c3on body{overflow:hidden;height:100%;overscroll-behavior:none}
html.c3on #app{pointer-events:none}
#c3root{position:fixed;inset:0;z-index:1;display:none;background:radial-gradient(ellipse at 50% 42%,#1e5038 0%,#0c2a1c 52%,#03100a 100%);touch-action:none;-webkit-user-select:none;user-select:none}
#c3root canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.w7{pointer-events:auto;position:fixed;z-index:10;box-sizing:border-box;font:500 clamp(13px,.55vw + 10px,16px)/1.25 "Segoe UI","Noto Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
/* vidrio Aero */
.w7g{background:linear-gradient(180deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.16) 46%,rgba(255,255,255,.04) 50%,rgba(255,255,255,.18) 100%),rgba(58,104,146,.42);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);border:1px solid rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.75),0 6px 22px rgba(0,0,0,.5);border-radius:8px;color:#fff;text-shadow:0 0 6px rgba(0,0,0,.85),0 1px 2px #000}
/* botones Windows 7 */
.w7b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;min-width:42px;padding:0 14px;border:1px solid #707070;border-radius:4px;background:linear-gradient(#f2f2f2 0%,#ebebeb 48%,#dddddd 52%,#cfcfcf 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8);color:#111;text-shadow:none;font:600 1em "Segoe UI","Noto Sans",system-ui,sans-serif;cursor:pointer;touch-action:manipulation;white-space:nowrap}
@media (hover:hover){.w7b:hover{border-color:#3c7fb1;background:linear-gradient(#eaf6fd 0%,#d9f0fc 48%,#bee6fd 52%,#a7d9f5 100%)}}
.w7b:active{border-color:#2c628b;background:linear-gradient(#e5f4fc 0%,#c4e5f6 48%,#98d1ef 52%,#68b3db 100%);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.w7b[disabled]{opacity:.5;pointer-events:none}
.w7b.p{border-color:#3c7fb1;animation:w7glow 1.6s ease-in-out infinite}
@keyframes w7glow{0%,100%{box-shadow:inset 0 0 0 1px #fff,0 0 4px 1px rgba(80,180,255,.55)}50%{box-shadow:inset 0 0 0 1px #fff,0 0 12px 4px rgba(80,190,255,.95)}}
/* globo de aviso (estilo Windows 7) */
.t3msg{top:calc(env(safe-area-inset-top,0px) + 84px);left:50%;transform:translateX(-50%);max-width:min(520px,calc(100% - 24px));padding:10px 14px;border:1px solid #767676;border-radius:6px;background:linear-gradient(#fff,#e4e5f0);color:#000;box-shadow:0 4px 14px rgba(0,0,0,.45);text-align:center;pointer-events:none;animation:t3fade 4.5s forwards}
@keyframes t3fade{0%{opacity:0;transform:translate(-50%,-6px)}6%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
/* etiquetas de los jugadores y del mazo (las coloca el JS encima de la mesa) */
.t3pl{left:0;top:0;color:#fff;font-size:.8em;font-weight:600;white-space:nowrap;pointer-events:none;text-shadow:0 1px 3px #000,0 0 6px #000;will-change:transform}
/* fondo de la sala según el color de la mesa */
html[data-bg="blue"] #c3root{background:radial-gradient(ellipse at 50% 42%,#1d3f63 0%,#0c1f36 52%,#030a14 100%)}
html[data-bg="red"] #c3root{background:radial-gradient(ellipse at 50% 42%,#4f1a20 0%,#2a0b0f 52%,#0f0305 100%)}
html[data-bg="orange"] #c3root{background:radial-gradient(ellipse at 50% 42%,#573113 0%,#2c1707 52%,#0f0702 100%)}
html[data-bg="purple"] #c3root{background:radial-gradient(ellipse at 50% 42%,#3a2257 0%,#1d0f30 52%,#0a0412 100%)}
html[data-bg="graphite"] #c3root{background:radial-gradient(ellipse at 50% 42%,#363b42 0%,#1a1d21 52%,#08090a 100%)}
@keyframes t3pop{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
html.c3ap #chat{display:none!important}
html.c3mini .t3msg{top:calc(env(safe-area-inset-top,0px) + 56px)}
/* carta del descarte en grande */
#t3peek{left:0;top:0;z-index:20;padding:8px 8px 6px;border-radius:10px;pointer-events:none;text-align:center;opacity:0;visibility:hidden;transition:opacity .12s,visibility 0s .12s;will-change:transform}
#t3peek.on{opacity:1;visibility:visible;transition:opacity .12s}
#t3peek img{display:block;width:clamp(120px,32vw,150px);aspect-ratio:256/358;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.55)}
#t3peek .nm{margin-top:4px;font-weight:700;font-size:1.05em}
/* cartita del descarte abajo a la izquierda (solo cuando la pila no se ve en pantalla) */
#t3dpv{left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:9;padding:4px 6px 5px;border-radius:9px;pointer-events:none;text-align:center;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .15s,transform .15s,visibility 0s .15s}
#t3dpv.on{opacity:1;visibility:visible;transform:none;transition:opacity .15s,transform .15s}
#t3dpv small{display:block;font-size:.72em;opacity:.95;margin-bottom:3px}
#t3dpv img{display:block;width:clamp(56px,7vw,84px);aspect-ratio:256/358;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.5)}
#t3dpv .nm{margin-top:2px;font-weight:700;font-size:.85em}
#t3dpv.new img{animation:t3dpvnew 1.2s ease-out}
@keyframes t3dpvnew{0%{box-shadow:0 0 0 3px #fff,0 0 18px 8px rgba(255,220,110,.95)}100%{box-shadow:0 3px 10px rgba(0,0,0,.5)}}
/* en pantallas angostas la barra y tu mano ocupan todo lo ancho: va encima de tu mano */
@media (max-width:699px){#t3dpv{bottom:calc(var(--t3fan,200px) + 6px)}}
.c4m{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:-.12em;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.c4m.r{background:radial-gradient(circle at 35% 30%,#ff9a8f 0%,#e53935 42%,#9a1c1c 100%)}
.c4m.y{background:radial-gradient(circle at 35% 30%,#fff7b0 0%,#f9c623 42%,#b28704 100%)}
html.c3dark .t3msg{border-color:#0d0d0d;background:linear-gradient(#3b3e44,#25272b);color:#eee}
/* ===== Uno 3D (la interfaz de encima va en ui_juegos.css) ===== */
html.u3on,html.u3on body{overflow:hidden;height:100%;overscroll-behavior:none}
html.u3on #app{pointer-events:none}
#u3root{position:fixed;inset:0;z-index:1;display:none;background:radial-gradient(ellipse at 50% 42%,#3b2a1e 0%,#1c130c 52%,#080503 100%);touch-action:none;-webkit-user-select:none;user-select:none}
#u3root canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.u3chip{display:inline-block;width:.85em;height:.85em;border-radius:50%;vertical-align:-.08em;background:var(--c);box-shadow:0 0 0 2px #fff,0 0 8px var(--c)}
/* símbolo de la carta especial que salta sobre el descarte (o ¡UNO! sobre un jugador) */
.u3fx{position:fixed;z-index:40;pointer-events:none;transform:translate(-50%,-50%);text-align:center;animation:u3fx 1.5s ease-out forwards}
.u3fx b{display:block;font:italic 900 46px/1 "Arial Black","Segoe UI",system-ui,sans-serif;color:#fff;-webkit-text-stroke:2px rgba(0,0,0,.55);text-shadow:0 0 18px var(--c),0 0 6px var(--c),0 3px 6px #000}
.u3fx.big b{font-size:clamp(56px,11vmin,96px)}
.u3fx small{display:block;margin-top:2px;font:800 18px "Segoe UI",system-ui,sans-serif;color:#fff;text-shadow:0 0 8px var(--c),0 1px 3px #000}
@keyframes u3fx{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
/* ===== Casa de juegos 3D (pantalla de inicio) ===== */
html.h3on,html.h3on body{overflow:hidden;height:100%;overscroll-behavior:none}
html.h3on #app{pointer-events:none}
#h3root{position:fixed;inset:0;z-index:1;display:none;touch-action:none;-webkit-user-select:none;user-select:none}
#h3root canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#h3top{top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;right:8px;display:flex;align-items:center;gap:8px;padding:4px 6px;min-height:46px}
#h3top .h3t{white-space:nowrap;padding:0 6px}
#h3top input{flex:1;min-width:0;max-width:260px;height:36px;margin-left:auto;padding:0 10px;border:1px solid #707070;border-radius:4px;font:inherit;background:#fff;color:#111;text-shadow:none}
html.c3dark #h3top input{background:#1f2124;color:#eee;border-color:#111}
@media (max-width:520px){#h3top .h3t b{display:none}}
#h3hint{left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translateX(-50%);padding:8px 14px;border-radius:18px;font-size:.92em;text-align:center;max-width:calc(100% - 24px);animation:t3pop .3s ease-out}
.h3sign{z-index:9;left:0;top:0;padding:5px 12px 6px;border-radius:10px;text-align:center;white-space:nowrap;cursor:pointer;touch-action:manipulation;will-change:transform}
.h3sign b{font-size:1.08em}.h3sign small{display:block;font-size:.78em;opacity:.95}
.h3sign.on{border-color:#ffe27a;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),0 0 16px 4px rgba(255,220,110,.8)}
#h3me{left:0;top:0;font-size:.85em}
#h3inv{left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;max-width:calc(100% - 20px);white-space:nowrap}
#h3top .h3ppl{white-space:nowrap;font-size:.9em;opacity:.95}
.h3sign.open small{color:#b9ffc8;font-weight:700}
/* emotes y "Di algo…" abajo */
#h3bar{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px;max-width:calc(100% - 16px);border-radius:10px}
#h3bar .em{min-width:40px;padding:0 6px;font-size:1.15em}
#h3bar .say{display:flex;gap:4px;margin-left:4px}
#h3bar input{width:min(220px,30vw);height:38px;padding:0 10px;border:1px solid #707070;border-radius:4px;font:inherit;background:#fff;color:#111;text-shadow:none}
html.c3dark #h3bar input{background:#1f2124;color:#eee;border-color:#111}
@media (max-width:600px){#h3bar{flex-wrap:wrap;justify-content:center}#h3bar .em{min-width:36px;min-height:36px}#h3bar .say{flex:1 1 100%;margin:0}#h3bar input{flex:1;width:auto}}
/* nombres, globitos y avisos que siguen a cada Mii */
#h3lay{position:fixed;inset:0;z-index:6;pointer-events:none;display:none;overflow:hidden}
#h3lay .h3nm{left:0;top:0;font-size:.85em;will-change:transform}
#h3lay .h3nm.me{color:#ffe27a}
.h3bub{position:absolute;left:0;top:0;max-width:220px;padding:7px 11px;border:1px solid #767676;border-radius:12px;background:linear-gradient(#fff,#eceef4);color:#111;font:600 14px/1.3 "Segoe UI",system-ui,sans-serif;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.4);animation:t3pop .18s ease-out;transition:opacity .4s;will-change:transform;overflow-wrap:anywhere}
.h3bub::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#eceef4}
.h3bub.emo{padding:2px 8px;font-size:34px;line-height:1.2;background:none;border:0;box-shadow:none;animation:h3emo .5s ease-out}.h3bub.emo::after{display:none}
.h3bub.out{opacity:0}
@keyframes h3emo{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
html.c3dark .h3bub:not(.emo){background:linear-gradient(#3b3e44,#25272b);color:#eee;border-color:#0d0d0d}html.c3dark .h3bub::after{border-top-color:#25272b}
#h3toasts{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
@media (max-width:600px){#h3toasts{bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}}
.h3toast{position:static;padding:6px 12px;border-radius:14px;font-size:.88em;animation:t3pop .2s ease-out}
/* pantallas bajitas (celular acostado) */
@media (max-height:520px){.t3msg{top:50px}}
</style>
